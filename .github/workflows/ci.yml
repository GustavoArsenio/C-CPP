name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build python3
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_C_COMPILER=${{ matrix.compiler }} -DCMAKE_CXX_COMPILER=${{ matrix.compiler == 'gcc' && 'g++' || 'clang++' }} -DBUILD_TESTING=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  formatting:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18
      - name: Check formatting
        run: make format-check

  gcc-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure GCC analyzer and optional examples
        run: >-
          cmake -S . -B build/gcc-analysis -DBUILD_TESTING=ON
          -DLEARNING_ENABLE_GCC_ANALYZER=ON
          -DLEARNING_BUILD_POSIX_NETWORKING=ON
          -DLEARNING_BUILD_OPENSSL_EXAMPLES=ON
      - name: Build all examples (GCC analyzer on C targets)
        run: cmake --build build/gcc-analysis --parallel
      - name: Run tests for GCC analyzer build
        run: ctest --test-dir build/gcc-analysis --output-on-failure

  clang-tidy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Report Clang and Clang-Tidy versions
        run: clang --version && clang-tidy --version
      - name: Configure Clang-Tidy analyzer baseline
        run: >-
          cmake -S . -B build/clang-tidy -G Ninja
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
          -DBUILD_TESTING=ON
          -DLEARNING_ENABLE_CLANG_TIDY=ON
      - name: Build default targets with Clang-Tidy
        run: cmake --build build/clang-tidy --parallel
      - name: Test Clang build
        run: ctest --test-dir build/clang-tidy --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure C and C++ sanitizers with optional targets
        run: >-
          cmake -S . -B build/sanitizers -DBUILD_TESTING=ON
          -DLEARNING_ENABLE_SANITIZERS=ON
          -DLEARNING_BUILD_POSIX_NETWORKING=ON
          -DLEARNING_BUILD_OPENSSL_EXAMPLES=ON
      - name: Build sanitized examples and tests
        run: cmake --build build/sanitizers --parallel
      - name: Test sanitized examples and tests
        run: ctest --test-dir build/sanitizers --output-on-failure

  optional-examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install OpenSSL development files
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Configure optional examples
        run: cmake -S . -B build -DLEARNING_BUILD_POSIX_NETWORKING=ON -DLEARNING_BUILD_OPENSSL_EXAMPLES=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
